# deploy dish-manager with only ds-manager, spfrx, spf, b5dc proxy and sims with default instance 001
global:
  minikube: true
  operator: true
  station_ids: ["s1"]

ska-mid-dish-ds-manager:
  enabled: true

ska-tango-base:
  enabled: true

ska-mid-dish-simulators:
  enabled: true
  deviceServers:
    spfdevice:
      enabled: true
    spfrxdevice:
      enabled: true
  dsOpcuaSimulator:
    enabled: true

ska-mid-wms:
  enabled: false

# Meerkat tango device
ska-mid-meerkat-wms-tango-device:
  enabled: true
  deviceServers:
    meerkatwms:
      enabled: true
      file: "data/weather_tango_device.yaml"

  weathertangodevice:
    image:
      registry: artefact.skao.int
      image: ska-mid-meerkat-lmc
      tag: 0.1.0
      pullPolicy: IfNotPresent

  dsconfig:
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-dsconfig
      tag: 1.8.5

# Meerkat weather simulator
ska-mid-meerkat-wms-simulator:
  enabled: true
  weatherstation:
    enabled: true
    image:
      registry: artefact.skao.int
      image: ska-mid-meerkat-lmc-katcp-sims
      tag: 0.1.0
      pullPolicy: IfNotPresent

dishmanager:
  wms:
    monitoring: true
    station_ids: ["1"]
    device_family: "mk-weather-monitoring"
    station_ids: ["s1"]