# deploy dish-manager with spfrx and spf sim with default instance 001, substituting DS with an AP Manager
global:
  minikube: true
  operator: true
  dishes: ["001"]

ska-tango-base:
  enabled: true

ska-mid-dish-ds-manager:
  enabled: false

ska-mid-dish-simulators:
  enabled: true
  deviceServers:
    spfdevice:
      enabled: true
    spfrxdevice:
      enabled: true
  dsOpcuaSimulator:
    enabled: false

# -----------------------------------------------------------------------------
# Dish Manager config - Configure the DS TRL to point to an AP Manager instance
# -----------------------------------------------------------------------------
dishmanager:
  b5dcproxy:
    monitoring: false
  ds:
    fqdn: ""
    domain_name: "mid-dish"
    family_name: "meerkat-ap-manager"

# -------------------------------------------------------
# MeerKAT AP Manager and AP Simulator (TBD) configuration
# -------------------------------------------------------

# TODO Configure Meerkat AP Manager to AP simulator instance once
# simulator released

ska-mid-meerkat-ap-manager:
  enabled: true
  deviceServers:
    meerkatapmanager:
      enabled: true

