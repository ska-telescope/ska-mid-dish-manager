global:
  minikube: true
  operator: true
  dishes: ["001", "MKT111"]
  station_ids: ["s1"] # station ids of the meerkat weather stations

ska-tango-base:
  enabled: true

ska-mid-dish-ds-manager:
  enabled: true
  dishstructuremanager:
    image:
      registry: artefact.skao.int
      image: registry.gitlab.com/ska-telescope/mid-dish/ska-mid-dish-ds-manager/ska-mid-dish-ds-manager
      tag: 9.2.0-dev.c127e658a

ska-mid-dish-simulators:
  enabled: true
  deviceServers:
    spfdevice:
      enabled: true
    spfrxdevice:
      enabled: true
  dsOpcuaSimulator:
    enabled: true

ska-mid-wms:
  enabled: false

# Meerkat tango device
ska-mid-meerkat-wms-tango-device:
  enabled: true
  deviceServers:
    meerkatwms:
      enabled: true
  
# Meerkat weather simulator
ska-mid-meerkat-wms-simulator:
  enabled: true
  weatherstation:
    enabled: true

ska-mid-dish-b5dc-proxy:
  enabled: true

dishmanager:
  wms:
    monitoring: true
    device_family: "mk-weather-monitoring"
    station_ids: ["s1"]
  b5dcproxy:
    monitoring: true
