global:
  minikube: true
  operator: true
  dishes: ["001", "MKT111"]

ska-tango-base:
  enabled: true

ska-mid-dish-ds-manager:
  enabled: true

ska-mid-dish-simulators:
  enabled: true
  deviceServers:
    spfdevice:
      enabled: true
    spfrxdevice:
      enabled: true
  dsOpcuaSimulator:
    enabled: true

ska-mid-wms:
  enabled: true

ska-mid-dish-b5dc-proxy:
  enabled: true

dishmanager:
  wms:
    monitoring: true
    station_ids: ["1"]
  b5dcproxy:
    monitoring: true

ska-mid-dish-ds-manager:
  dsmanager:
    image:
      registry: registry.gitlab.com/ska-telescope/mid-dish/ska-mid-dish-ds-manager
      image: ska-mid-dish-ds-manager
      tag: 8.2.6-dev.c93b4002e
      pullPolicy: IfNotPresent