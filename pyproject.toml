[project]
name = "ska-mid-dish-manager"
version = "10.0.0"
description = "SKA Dish Manager TANGO device server"
authors = [{name = "Team Karoo"}]
maintainers = [{name = "Team Karoo"}]
license = "BSD-3-Clause"
readme = 'README.md'
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pytango>=10.3.1,<11.0.0",
    "numpy>=2.3",
    "ska-control-model>=1.0.0",
    "ska-ser-logging>=0.4.1",
    "ska-tango-base==1.6.1",
    "networkx>=2.6.3,<3.0.0",
    "rule-engine>=3.5.0,<4.0.0",
    "astropy>=6.0.1",
    "typing-extensions>=4.3.0",
    "ska-mid-dish-dcp-lib>=0.0.9,<0.0.10",
    "requests>=2.34.2,<3.0.0",
]

[project.urls]
Documentation = "https://developer.skao.int/projects/ska-mid-dish-manager/en/latest/?badge=latest"
Repository = "https://gitlab.com/ska-telescope/ska-mid-dish-manager"

[project.scripts]
DishManager = 'ska_mid_dish_manager.devices.DishManagerDS:main'

[tool.uv]
default-groups = ["dev", "docs"]



[[tool.uv.index]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"
default = true

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple/"

[dependency-groups]
dev = [
    "black>=22.3.0,<23.0.0",
    "isort>=5.6.4,<6.0.0",
    "flake8>=3.8.4,<4.0.0",
    "pylint>=2.17.2,<3.0.0",
    "coverage>=6.1.1,<7.0.0",
    "pytest>=7.1.0,<8.0.0",
    "unittest2>=1.1.0,<2.0.0",
    "pytest-cov>=2.10.1,<3.0.0",
    "pytest-repeat>=0.9.1,<0.10.0",
    "pylint-junit>=0.3.2,<0.4.0",
    "pytest-json-report>=1.4.1,<2.0.0",
    "pytest-forked>=1.4.0,<2.0.0",
    "pytest-mock>=3.9.0,<4.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "mock>=4.0.3,<5.0.0",
    "tango-simlib>=0.9.4,<0.10.0",
    "requests>=2.28.1,<3.0.0",
    "mypy>=0.982,<0.983",
    "ruff>=0.12.0,<0.13.0",
    "matplotlib>=3.10.3,<4.0.0",
    "ty>=0.0.69",
]
docs = [
    "sphinx>=6.2.1,<7.0.0",
    "docutils<0.20",
    "sphinx-tabs",
    "typing_extensions",
    "sphinx-copybutton",
    "ska-ser-sphinx-theme>=0.2.1,<0.3.0",
    "sphinx-autodoc-typehints>=1.23.0,<2.0.0",
    "sphinxcontrib-plantuml>=0.30,<0.31",
    "ska-tango-difdoc>=0.5.0,<0.6.0",
]

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "--json-report --json-report-file=build/reports/report.json --cov-report html:build/htmlcov --cov-report xml:build/reports/code-coverage.xml --cov-report term:skip-covered --cov=ska_mid_dish_manager --junitxml=build/reports/unit-tests.xml --verbose"
console_output_style = "progress"
junit_family = "legacy"
markers = [
    "unit",
    "acceptance",
    "stress",
    "track_patterns",
    "movement",
    "acceptance_incl_b5dc",
]
log_cli = true  # show logs if test fails
log_cli_level = "ERROR"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    ".make",
    "build",
    "dist",
    "docs",
    "notebooks",
    "resources",
    "scripts",
]
 
# Same as Black.
line-length = 99
indent-width = 4
 
[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "D", # pydocstyle
    "E", # pycodestyle-error
    "W", # pycodestyle-warning
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "PL" # pylint
]
ignore = [
    "D205", # 1 blank line required between summary line and description
    "D419", # Docstring is empty
    "D401", # Imperitive mood first line
    "PLR2004", # Magic constant
    "D104", # Missing docstring in public package
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D107", # Missing docstring in `__init__`
    "D103", # Missing docstring in public function
    "D105", # Missing docstring in magic method
    "D100", # Missing docstring in public module
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "N802", # Function name should be lower case
    "D404", # First word should not be "This"
    "N806", # Variable in function should be lowercase
    "N811", # Constant imported as non-constant
    "N999", # Invalid module name
    "PLR0911", # Too many return statements
]
 
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
 
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
 
[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
 
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
 
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
 
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
 
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true
 
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = 70


[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 99

[tool.coverage.paths]
source = ["src"]

[tool.coverage.run]
data_file = ".coverage/.coverage"
branch = true
source = ["ska_mid_dish_manager"]

[tool.coverage.report]
show_missing = false

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.src]
include = ["src", "tests"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

