version: 2

build:
  os: "ubuntu-26.04"
  tools:
    python: "3.14"
  apt_packages:
    - plantuml
  jobs:
    pre_build:
      - make docs-pre-build DOCS_TARGET_ARGS=html

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

submodules:
  include:
    - .make
  recursive: true

sphinx:
  configuration: docs/src/conf.py
